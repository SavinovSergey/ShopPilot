[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shoppilot"
version = "0.1.0"
description = "Production-like e-commerce retrieval and recommendation portfolio project"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pyspark==4.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
